name: JESOldLootRemover
version: '${version}'
main: dev.ciel.jESOldLootRemover.JESOldLootRemover
api-version: '26.2'
load: POSTWORLD
author: ciel
description: Removes containers placed before the season cutoff.
depend: [CoreProtect]
softdepend: [WorldGuard]

commands:
  oldlootremover:
    description: Reload the config or toggle debug logging.
    usage: /oldlootremover <reload|debug>
    aliases: [olr]
    permission: oldlootremover.admin

permissions:
  oldlootremover.notify:
    default: op
  oldlootremover.admin:
    default: op
